openapi: 3.1.0
info:
  title: Aimhi Deal Desk API
  version: 0.1.0
  description: Scaffolded API contract for bootstrap validation.
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service health.
  /api/deals/{dealId}/access-check:
    get:
      operationId: getDealAccessCheck
      parameters:
        - in: path
          name: dealId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Access decision.
